[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-insights"
version = "1.0.0"
description = "Sales analysis in pandas: cleaning with an audit trail, cohort retention, RFM segmentation, seasonality and a self-contained HTML report."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Umer Hashmi" }]
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.26", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.8"]

[project.scripts]
sales = "salesinsights.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# An explicit rule set, rather than whatever the newest ruff turns on by default:
# an unpinned linter with implicit rules means CI breaks on someone else's release
# schedule, not on a change to this code.
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
